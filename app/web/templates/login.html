<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backend Monitor - Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#111217;color:#d8d9da;display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
.login-card{background:#1b1c21;border:1px solid #2c2d33;border-radius:8px;padding:48px 40px;width:100%;max-width:380px}
.login-card .logo{width:40px;height:40px;background:linear-gradient(135deg,#5794f2,#3d71d9);border-radius:4px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:18px;font-weight:700;color:#fff}
.login-card h1{font-size:20px;font-weight:600;margin-bottom:4px;color:#f0f1f2;text-align:center;letter-spacing:-.2px}
.login-card .subtitle{font-size:13px;color:#6e7079;text-align:center;margin-bottom:32px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:#9a9ca3;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;padding:10px 12px;border:1px solid #2c2d33;border-radius:4px;background:#111217;color:#d8d9da;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:#5794f2}
.form-group input::placeholder{color:#55565e}
.btn{width:100%;padding:10px 14px;border:none;border-radius:4px;background:#5794f2;color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .2s}
.btn:hover{background:#4a85e0}
.btn:active{opacity:.9}
.error{background:#3d1214;border:1px solid #f2495c;border-radius:4px;padding:10px;margin-bottom:20px;font-size:12px;color:#f2495c;display:none;line-height:1.4}
</style>
</head>
<body>
<div class="login-card">
<div class="logo">M</div>
<h1>Backend Monitor</h1>
<p class="subtitle">Sign in to continue</p>
<div class="error" id="error"></div>
<form id="loginForm" method="post" action="/monitor/login">
<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Enter password" autofocus required>
</div>
<button type="submit" class="btn">Sign In</button>
</form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit',async function(e){
e.preventDefault();
const pwd=document.getElementById('password').value;
try{
const r=await fetch('/monitor/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'password='+encodeURIComponent(pwd)});
if(r.redirected)window.location.href=r.url;
else{const d=await r.json();document.getElementById('error').style.display='block';document.getElementById('error').textContent=d.detail||'Login failed'}
}catch(ex){document.getElementById('error').style.display='block';document.getElementById('error').textContent='Network error'}
});
</script>
</body>
</html>
