<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070a10">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.ico">
<title>Sinug Gateway — Monitor Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a10;--panel:#0d131c;--panel-2:#151e2c;--border:#1f2a3c;--border-soft:#141d2b;--text:#eef2f8;--muted:#97a1b3;--faint:#5f6c82;--accent:#8ea0ff;--accent-2:#6fd8e7;--accent-hover:#7a8ef7;--red:#f2737e;--green:#3fce8f;--yellow:#e2bf68;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--display:'Sora','Inter',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:rgba(142,160,255,.32)}
body{font-family:var(--font);background:radial-gradient(800px 460px at 50% -10%,rgba(142,160,255,.12),transparent 62%),radial-gradient(600px 400px at 85% 110%,rgba(111,216,231,.07),transparent 60%),var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.login-card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 30%),var(--panel);border:1px solid var(--border);border-radius:16px;padding:38px 34px;width:100%;max-width:390px;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.login-card::before{content:'';position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(142,160,255,.4),transparent);border-radius:16px 16px 0 0}
.logo{width:46px;height:46px;background:linear-gradient(135deg,#9db0ff 0%,#6fd8e7 100%);border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 6px 22px rgba(142,160,255,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.logo svg{width:25px;height:25px;stroke:#0a0f1c}
h1{font-family:var(--display);font-size:20px;font-weight:700;margin-bottom:5px;color:var(--text);text-align:center;letter-spacing:-.03em}
.subtitle{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:26px;letter-spacing:-.01em}
.notice{background:rgba(142,160,255,.08);border:1px solid rgba(142,160,255,.3);border-radius:10px;padding:10px 13px;margin-bottom:16px;font-size:12px;color:var(--accent);display:none;line-height:1.55}
.error{background:rgba(242,115,126,.08);border:1px solid rgba(242,115,126,.4);border-radius:10px;padding:10px 13px;margin-bottom:16px;font-size:12px;color:var(--red);display:none;line-height:1.55}
.error.show,.notice.show{display:block}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-family:var(--display);font-size:10.5px;font-weight:700;margin-bottom:7px;color:var(--muted);text-transform:uppercase;letter-spacing:1.3px}
.pwd-wrap{position:relative}
.pwd-wrap input{width:100%;padding:11px 46px 11px 13px;border:1px solid var(--border);border-radius:10px;background:#04060a;color:var(--text);font-size:14px;font-family:var(--font);outline:none;transition:border-color .15s,box-shadow .15s;letter-spacing:-.01em}
.pwd-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(142,160,255,.14)}
.pwd-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;padding:6px 9px;border-radius:7px}
.pwd-toggle:hover{color:var(--text);background:rgba(142,160,255,.08)}
.pwd-toggle:focus-visible,.btn:focus-visible,.pwd-wrap input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.caps{font-size:11px;color:var(--yellow);margin-top:7px;display:none;font-weight:600}
.btn{width:100%;padding:12px 14px;border:none;border-radius:10px;background:linear-gradient(135deg,#9db0ff 0%,#7a8ef7 100%);color:#0a0f1c;font-size:14px;font-weight:700;font-family:var(--font);letter-spacing:-.01em;cursor:pointer;box-shadow:0 6px 20px rgba(142,160,255,.32);transition:all .15s}
.btn:hover:not(:disabled){box-shadow:0 8px 26px rgba(142,160,255,.42);filter:brightness(1.05)}
.btn:disabled{opacity:.6;cursor:wait}
.hint{margin-top:18px;font-size:11px;color:var(--faint);text-align:center;line-height:1.55;font-family:var(--font)}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<main class="login-card" aria-labelledby="title">
<div class="logo" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#0a0f1c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V10a8 8 0 0 1 16 0v8"/><circle cx="12" cy="18" r="2.2"/></svg></div>
<h1 id="title">Sinug Gateway</h1>
<p class="subtitle">Monitor operasional &bull; masuk untuk lanjut</p>
<div class="notice" id="expired" role="status">Sesi berakhir, silakan masuk kembali.</div>
<div class="error" id="error" role="alert"></div>
<form id="loginForm" method="post" action="/monitor/login" novalidate>
<div class="form-group">
<label for="password">Password</label>
<div class="pwd-wrap">
<input type="password" id="password" name="password" placeholder="Enter password" autofocus required autocomplete="current-password" aria-describedby="caps">
<button type="button" class="pwd-toggle" id="toggle" aria-label="Tampilkan password">Show</button>
</div>
<div class="caps" id="caps">Caps Lock aktif</div>
</div>
<button type="submit" class="btn" id="submit">Sign In</button>
</form>
<p class="hint">Cookie sesi 24 jam &bull; HttpOnly &bull; tidak dibagikan</p>
</main>
<script>
(function(){
var form=document.getElementById('loginForm'),pwd=document.getElementById('password'),
err=document.getElementById('error'),btn=document.getElementById('submit'),
toggle=document.getElementById('toggle'),caps=document.getElementById('caps'),
card=document.querySelector('.login-card');
if(new URLSearchParams(location.search).get('expired')==='1'){
document.getElementById('expired').classList.add('show');}
function showError(m){err.textContent=m;err.classList.add('show');
card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');}
toggle.addEventListener('click',function(){
var show=pwd.type==='password';pwd.type=show?'text':'password';
toggle.textContent=show?'Hide':'Show';toggle.setAttribute('aria-label',show?'Sembunyikan password':'Tampilkan password');pwd.focus();});
pwd.addEventListener('keyup',function(e){
caps.style.display=(e.getModifierState&&e.getModifierState('CapsLock'))?'block':'none';});
form.addEventListener('submit',async function(e){
e.preventDefault();err.classList.remove('show');
var v=pwd.value;if(!v){showError('Password wajib diisi.');pwd.focus();return;}
btn.disabled=true;btn.textContent='Signing in...';
try{
var next=new URLSearchParams(location.search).get('next')||'';
var url='/monitor/login'+(next.indexOf('/monitor')===0?'?next='+encodeURIComponent(next):'');
var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'password='+encodeURIComponent(v),credentials:'same-origin'});
if(r.redirected){window.location.href=r.url;return;}
if(r.ok){window.location.href=next.indexOf('/monitor')===0?next:'/monitor';return;}
var d=null;try{d=await r.json();}catch(_){}
showError((d&&d.detail)||('Login gagal (HTTP '+r.status+')'));
}catch(ex){showError('Network error, coba lagi.');}
finally{btn.disabled=false;btn.textContent='Sign In';}});
})();
</script>
</body>
</html>
